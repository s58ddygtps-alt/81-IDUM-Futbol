<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>81-Maktab Futbol</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root { --primary: #16a34a; --primary-hover: #15803d; --primary-soft: #f0fdf4; --bg: #ffffff; --card-bg: #f8fafc; --text-main: #0f172a; --text-muted: #64748b; --border: #e2e8f0; --radius: 16px; }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text-main); min-height: 100vh; padding: 20px 18px; }
    header { text-align: center; margin-bottom: 24px; position: relative; }
    .badge { display: inline-block; background: var(--primary-soft); color: var(--primary); font-size: 13px; font-weight: 600; padding: 6px 14px; border-radius: 20px; margin-bottom: 12px; border: 1px solid rgba(22, 163, 74, 0.15); }
    header h1 { font-size: 22px; font-weight: 700; }
    .admin-btn { position: absolute; top: 0; right: 0; background: #f1f5f9; border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 20px; cursor: pointer; display: none; }
    .menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; max-width: 420px; margin: 0 auto; }
    .menu-card { background: var(--card-bg); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 20px 16px; text-align: center; cursor: pointer; transition: 0.2s; }
    .menu-card:active { transform: scale(0.96); border-color: var(--primary); }
    .menu-card span { display: block; font-size: 15px; font-weight: 600; margin-top: 10px; }
    .icon { font-size: 28px; }
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); opacity: 0; visibility: hidden; transition: 0.3s; z-index: 100; }
    .overlay.active { opacity: 1; visibility: visible; }
    .bottom-sheet { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-radius: 24px 24px 0 0; padding: 20px; transform: translateY(100%); transition: 0.3s; z-index: 101; max-height: 85vh; overflow-y: auto; }
    .bottom-sheet.active { transform: translateY(0); }
    .sheet-title { font-size: 18px; font-weight: 700; margin-bottom: 14px; display: flex; justify-content: space-between; }
    .close-btn { background: #f1f5f9; border: none; width: 30px; height: 30px; border-radius: 50%; font-weight: bold; cursor: pointer; }
    .list-item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #f1f5f9; font-size: 14px; }
    .btn { width: 100%; background: var(--primary); color: #fff; border: none; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 600; margin-top: 15px; cursor: pointer; text-decoration: none; display: block; text-align: center; }
    input, textarea { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; font-size: 14px; }
    #adminPanel { display: none; padding: 10px 0; }
    .admin-section { background: var(--card-bg); padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid var(--border); }
  </style>
</head>
<body>

  <header>
    <button class="admin-btn" id="adminBtn" onclick="loginAdmin()">⚙️</button>
    <div class="badge">⚽ Futbol Klubi</div>
    <h1 id="mainTitle">Xush kelibsiz!</h1>
    <p>Kerakli bo'limni tanlang</p>
  </header>

  <main class="menu-grid" id="mainMenu">
    <div class="menu-card" onclick="openModal('jadval')"><div class="icon">📅</div><span>Jadval</span></div>
    <div class="menu-card" onclick="openModal('tolov')"><div class="icon">💳</div><span>To'lov</span></div>
    <div class="menu-card" onclick="openModal('jamoa')"><div class="icon">👥</div><span>Jamoa</span></div>
    <div class="menu-card" onclick="openModal('yozilish')"><div class="icon">📝</div><span>Ariza topshirish</span></div>
  </main>

  <!-- Admin Panel -->
  <div id="adminPanel">
    <h2 style="margin-bottom: 15px;">Murabbiy Paneli</h2>
    <div class="admin-section"><h4>📅 Jadval</h4><textarea id="adminJadval" rows="3"></textarea></div>
    <div class="admin-section"><h4>💳 To'lov</h4><input id="adminTolovSumma" placeholder="Summa"><input id="adminTolovKarta" placeholder="Karta raqami"></div>
    <div class="admin-section"><h4>👥 Jamoa</h4><textarea id="adminJamoa" rows="4"></textarea></div>
    <button class="btn" onclick="saveAdminData()">Saqlash</button>
    <button class="btn" style="background:#64748b; margin-top:10px;" onclick="logoutAdmin()">Chiqish</button>
  </div>

  <!-- Modal -->
  <div class="overlay" id="overlay" onclick="closeModal()"></div>
  <div class="bottom-sheet" id="bottomSheet">
    <div class="sheet-title"><span id="sheetTitle"></span><button class="close-btn" onclick="closeModal()">✕</button></div>
    <div id="sheetBody"></div>
  </div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // 1. BU YERGA O'ZINGIZNING FIREBASE HAVOLANGIZNI QO'YING
    const firebaseConfig = {
      databaseURL: "SIZNING_FIREBASE_DATABASE_URL_SHU_YERGA" 
    };

    // 2. BU YERGA O'ZINGIZNING BOT TOKENINGIZNI QO'YING
    const BOT_TOKEN = "8536839353:AAEaQ6JDtwi3XE_xztnmjMA_4L3TEGKBFPU";
    // 3. BU YERGA O'ZINGIZNING USERNAME (masalan: @todo_plus_bot)
    const BOT_USERNAME = "todo_plus_bot"; 
    // 4. SIZNING ADMIN ID RAQAMINGIZ
    const ADMIN_ID = "6807333001"; 

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const tg = window.Telegram?.WebApp;

    if (tg) {
      tg.ready(); tg.expand();
      // Agar botga kirgan odam siz bo'lsangiz, Admin tugmasi ko'rinadi
      if (tg.initDataUnsafe?.user?.id?.toString() === ADMIN_ID) {
        document.getElementById('adminBtn').style.display = 'flex';
      }
    }

    let appData = {
      jadval: "Dushanba (16:00-17:30)\nShanba (15:00-16:30)",
      tolov: { summa: "300 000 so'm", karta: "8600 0000 0000 0000" },
      jamoa: "Abbosov Shohruh (Murabbiy)"
    };

    // Bazadan ma'lumotlarni yuklash
    async function loadData() {
      try {
        const snapshot = await get(ref(db, 'futbolData'));
        if (snapshot.exists()) {
          appData = snapshot.val();
        }
      } catch (e) { console.log("Baza xatosi:", e); }
    }
    loadData();

    // Modal oynalar
    window.openModal = function(type) {
      if (tg) tg.HapticFeedback.impactOccurred('light');
      const sheet = document.getElementById('bottomSheet');
      const title = document.getElementById('sheetTitle');
      const body = document.getElementById('sheetBody');

      if (type === 'jadval') {
        title.innerText = "📅 Jadval";
        body.innerHTML = appData.jadval.split('\n').map(l => `<div class="list-item"><span>${l}</span></div>`).join('');
      } 
      else if (type === 'tolov') {
        title.innerText = "💳 To'lov";
        body.innerHTML = `
          <div class="list-item"><span>Oylik:</span> <strong>${appData.tolov.summa}</strong></div>
          <div class="list-item"><span>Karta:</span> <strong>${appData.tolov.karta}</strong></div>
          <p style="font-size: 12px; color: gray; margin: 10px 0;">To'lov qilib, chekni botga yuboring.</p>
          <a href="https://t.me/${BOT_USERNAME}" class="btn">📸 Chekni yuborish</a>
        `;
      }
      else if (type === 'jamoa') {
        title.innerText = "👥 Jamoa";
        body.innerHTML = appData.jamoa.split('\n').map(l => `<div class="list-item"><span>${l}</span></div>`).join('');
      }
      else if (type === 'yozilish') {
        title.innerText = "📝 Ariza topshirish";
        body.innerHTML = `
          <input type="text" id="appName" placeholder="Ism va Familiya">
          <input type="tel" id="appPhone" placeholder="Telefon raqam">
          <button class="btn" onclick="submitApplication()">Yuborish</button>
        `;
      }
      document.getElementById('overlay').classList.add('active');
      sheet.classList.add('active');
    }

    window.closeModal = function() {
      document.getElementById('overlay').classList.remove('active');
      document.getElementById('bottomSheet').classList.remove('active');
    }

    // Arizani to'g'ridan-to'g'ri Telegramga yuborish
    window.submitApplication = async function() {
      const name = document.getElementById('appName').value;
      const phone = document.getElementById('appPhone').value;
      if(!name || !phone) { alert("Hamma joyni to'ldiring!"); return; }

      const text = `🔔 YANGI ARIZA!\n\n👤 Ism: ${name}\n📞 Tel: ${phone}`;
      
      try {
        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ chat_id: ADMIN_ID, text: text })
        });
        alert("Ariza murabbiyga yuborildi!");
        closeModal();
      } catch (e) {
        alert("Xatolik yuz berdi. Internetni tekshiring.");
      }
    }

    // Admin qismi
    window.loginAdmin = function() {
      if (prompt("Parol:") === "1234") {
        document.getElementById('mainMenu').style.display = 'none';
        document.querySelector('header').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'block';
        document.getElementById('adminJadval').value = appData.jadval;
        document.getElementById('adminTolovSumma').value = appData.tolov.summa;
        document.getElementById('adminTolovKarta').value = appData.tolov.karta;
        document.getElementById('adminJamoa').value = appData.jamoa;
      }
    }

    window.saveAdminData = async function() {
      appData.jadval = document.getElementById('adminJadval').value;
      appData.tolov.summa = document.getElementById('adminTolovSumma').value;
      appData.tolov.karta = document.getElementById('adminTolovKarta').value;
      appData.jamoa = document.getElementById('adminJamoa').value;

      // Firebase bazasiga saqlash
      try {
        await set(ref(db, 'futbolData'), appData);
        alert("Bazaga saqlandi! Endi barcha odamlar ko'radi.");
      } catch (e) {
        alert("Xatolik: " + e.message);
      }
    }

    window.logoutAdmin = function() {
      location.reload(); // Sahifani yangilash
    }
  </script>
</body>
</html>
